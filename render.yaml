# Render Blueprint — deploys the backend API.
# Render dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: sarthak-portfolio-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        sync: false   # e.g. https://sarthak-portfolio.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false   # email alerts via Resend (https://resend.com/api-keys)
      - key: CONTACT_TO
        sync: false   # inbox that receives alerts
